<html jwcid="@HTShell" title="Personality">
<head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type"/>

    <title>Similar Posts</title>
    <link href="../public/reset-fonts-grids-min.css" media="screen" rel="stylesheet" type="text/css">
    <style media="screen" type="text/css">
        body {
            background-color: #fff;
            background: #fff url(../public/images/header_bar.gif) repeat-x top left;
        }

        p {
            margin: 0 0 1em;
            line-height: 150%;
        }

        #doc2 {
            background-color: #fff;
        }

        a {
            color: #7ab2e3;
            font-weight: bold;
        }

        h2 {
            font: bold 152% / 152% georgia, serif;
            color: #34568E;
            margin: 0 0 1em;
        }

        h3 {
            font-weight: bold;
            color: #dcdee0;
        }

        .conversation h3 a {
            font: bold 152% / 152% georgia, serif;
            color: #0761a6;
            margin: 0 0 1em;
            text-decoration: none;
        }

        .subjectpost {
            margin: 0.5em 0 0;
            padding: 0.5em;
            background: #f1ecec;
        }

        .subjectpost h4 a {
            color: #000;
            text-decoration: none;
        }

        .conversation {
            margin: 0 0 2em;
        }

        .relatednews {
            margin: 1em 0 0 2em;
        }

        .relatednews li {
            margin: 0 0 1em;
        }

        .relatednews li a {
            color: #34568E;
            text-decoration: none;
        }

        .relatednews li h4 {
            font-weight: bold;
            color: #999;
        }

        .relatednews li p, .posts li p {
            font-size: 92%;
        }

        .relatednews .lead {
            background-color: transparent;
        }

        .posts li a {
            text-decoration: none;
        }

        .posts li p {
            margin-left: 1em;
        }

        .lead {
            background-color: #fafafa;
            margin-bottom: 1em;
        }

        .personality {
            position: relative;
            padding-left: 100px;
            min-height: 100px;
        }

        .personality img {
            position: absolute;
            top: 0;
            left: 0;
        }

        .personality h2 {
            margin-bottom: 0;
        }

        .personality h4 {
            font-weight: bold;
        }

        ul li {
            margin: 0 0 0.25em;
        }

        .post {
            padding: 1em 0 2em 1em;
        }

        .post h2 {
            margin-bottom: 0.25em;
        }

        .post h2 a, .personality h2 a {
            text-decoration: none;
            color: #333;
            border-bottom: 1px solid #333;
        }

        .post h3, .personality h3 {
            font: italic 107% / 122% Arial;
            color: #8a8a8a;
            margin-bottom: 0.2em;
        }

        .post ul {
            margin: 1em 0 0 1em
        }

        #hd {
            position: relative;
            height: 81px;
            background: #fff url(../public/images/header_bar.gif) repeat-x top left;
        }

        #hd #logo {
            position: absolute;
            top: 11px;
            left: 0;
        }

        #hd #HiTorro {
            position: absolute;
            right: 0;
            top: 54px;
        }

        #bd {
            padding-top: 1em;
        }

        #ft {
            color: #336da0;
            border-top: 1px dotted #eaeaea;
            margin: 2em 0 0;
            padding: 1em 1em 0;
            text-align: center;
            font-size: 92%;
        }

    </style>
</head>
<body>
<div class="yui-t7" id="doc2">

    <!-- Header.... -->
    <div id="hd">
        <a href="Front.htm" title="ConversationTracker Home"><img alt="ConversationTracker" height="59"
                                                                  id="logo"
                                                                  src="../public/images/convtracker_logo.gif" width="254"></a>
        <a href="http://www.HiTorro.net" target="_blank" title="HiTorro.net website"><img alt="a HiTorro Original Production"
                                                                                          height="18"
                                                                                          id="HiTorro" src="../public/images/hitorro_logo.gif"
                                                                                          width="163"></a>
    </div>

    <!-- Body.... -->
    <div id="bd">


        <div id="yui-main">
            <div class="yui-gc">
                <div class="yui-u first">

                    <h3>Compare to a web page</h3>

                    <form id="url_form" jwcid="@Form" success="listener:formAction">
                        <label for="url">URL: </label>
                        <input id="url" jwcid="@TextField" name="url" size="132" value="ognl:step.url"/>
                        <input type="submit" value="Compare URL">
                    </form>

                    <div>
                        <br/><br/>

                        <h3>Similar Posts:</h3>

                        <ul class="posts">
                            <span jwcid="@For" source="ognl:step.similar" value="ognl:curPostDisplay">
                                <h4><a href="ognl:curPostDisplay.url" jwcid="@Any"><span jwcid="@Insert"
                                                                                         value="ognl:curPostDisplay.title"/></a>
                                </h4>
                                <p><span jwcid="@Insert" value="ognl:curPostDisplay.shortBody"/></p>
                            </span>
                        </ul>
                    </div>

                </div>

            </div>
        </div>

    </div>

    <!-- Footer -->
    <div id="ft">
        <p>&copy; 2006 HiTorro. </p>
    </div>

</div>


<script src="../public/hitorrojs/yui/yahoo.js" type="text/javascript"></script>
<script src="../public/hitorrojs/yui/connection.js" type="text/javascript"></script>
<script src="../public/hitorrojs/yui/dom.js" type="text/javascript"></script>
<script src="../public/hitorrojs/yui/event.js" type="text/javascript"></script>
<script src="../public/hitorrojs/yui/animation.js" type="text/javascript"></script>
<script src="../public/hitorrojs/photoFeeds.js" type="text/javascript"></script>
</body>
</html>
